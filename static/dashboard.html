<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard - Painel da Doca</title>
<link rel="icon" type="image/png" href="/static/favicon.png" />
<link rel="manifest" href="/manifest-painel.json" />
<meta name="theme-color" content="#0f2347" />
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Painel Doca" />
<style>
  :root {
    color-scheme: light;
    --ink: #0b0f1a;
    --navy: #0f2347;
    --g600: #6b7280;
    --g400: #9ca3af;
    --g300: #d1d5db;
    --g200: #e5e7eb;
    --g100: #f3f4f6;
    --bg: #f6f7f9;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; margin: 0; color: var(--ink);
    min-height: 100vh; position: relative;
    background:
      radial-gradient(1100px 620px at 8% -8%, rgba(74, 128, 235, .55), transparent 62%),
      radial-gradient(900px 560px at 100% 4%, rgba(34, 78, 170, .60), transparent 58%),
      radial-gradient(1000px 700px at 62% 108%, rgba(6, 16, 40, .95), transparent 62%),
      linear-gradient(158deg, #07122b 0%, #0c2250 38%, #153f8f 72%, #1d56b8 100%);
    background-attachment: fixed;
  }
  body::before, body::after {
    content: ""; position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; filter: blur(70px);
  }
  body::before {
    width: 520px; height: 520px; top: 18%; left: -140px;
    background: radial-gradient(circle, rgba(120, 170, 255, .30), transparent 68%);
    animation: deriva1 38s ease-in-out infinite alternate;
  }
  body::after {
    width: 460px; height: 460px; bottom: -120px; right: 6%;
    background: radial-gradient(circle, rgba(70, 120, 235, .32), transparent 68%);
    animation: deriva2 46s ease-in-out infinite alternate;
  }
  @keyframes deriva1 { from { transform: translate(0, 0); } to { transform: translate(120px, 60px); } }
  @keyframes deriva2 { from { transform: translate(0, 0); } to { transform: translate(-100px, -70px); } }
  @media (prefers-reduced-motion: reduce) { body::before, body::after { animation: none; } }
  header, main { position: relative; z-index: 1; }

  header {
    background: rgba(255, 255, 255, .06); border-bottom: 1px solid rgba(255, 255, 255, .14);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    padding: 14px 32px; display: flex; align-items: center; gap: 14px;
  }
  header .logo { display: flex; align-items: center; background: #fff; padding: 6px 12px; border-radius: 8px; }
  header .logo img { height: 20px; display: block; }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .02em; flex: 1; color: #fff; padding-left: 14px; border-left: 1px solid rgba(255, 255, 255, .25); }
  .nav-link {
    background: rgba(255, 255, 255, .10); color: #fff; border: 1px solid rgba(255, 255, 255, .22);
    padding: 7px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none;
  }
  .nav-link:hover { background: rgba(255, 255, 255, .20); }

  main { max-width: 1760px; margin: 0 auto; padding: 8px 32px 48px; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 20px 0 4px; }
  .seg { display: inline-flex; background: rgba(255, 255, 255, .10); border: 1px solid rgba(255, 255, 255, .20); border-radius: 8px; padding: 3px; backdrop-filter: blur(10px); }
  .seg button {
    border: none; background: none; padding: 6px 16px; font-size: 13px; font-weight: 600;
    color: rgba(255, 255, 255, .78); border-radius: 6px; cursor: pointer;
  }
  .seg button:hover { color: #fff; }
  .seg button.ativo { background: #fff; color: var(--navy); }
  .toolbar .espaco { flex: 1; }
  .meta-box { display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(255, 255, 255, .8); }
  .meta-box input {
    width: 60px; padding: 6px 8px; border: 1px solid var(--g300); border-radius: 6px; font-size: 14px; text-align: center; color: var(--ink); background: #fff;
  }
  .meta-box input:focus { outline: none; border-color: var(--navy); }
  .btn-mini {
    border: 1px solid rgba(255, 255, 255, .22); background: rgba(255, 255, 255, .10); color: #fff; font-weight: 600; font-size: 13px;
    padding: 7px 12px; border-radius: 6px; cursor: pointer; text-decoration: none;
  }
  .btn-mini:hover { background: rgba(255, 255, 255, .20); }

  .secao { font-size: 11px; font-weight: 600; color: rgba(255, 255, 255, .72); text-transform: uppercase; letter-spacing: .1em; margin: 30px 0 10px; }
  .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 900px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .card { background: rgba(255, 255, 255, .97); border: 1px solid rgba(255, 255, 255, .6); border-radius: 12px; padding: 18px 20px; box-shadow: 0 10px 30px rgba(3, 10, 30, .28); }
  .card .valor { font-size: 28px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .card .label { font-size: 11px; color: var(--g600); margin-top: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .card .sub { font-size: 12px; margin-top: 8px; color: var(--g600); }
  .card.alerta { background: #05070d; border-color: rgba(255, 255, 255, .28); }
  .card.alerta .valor, .card.alerta .label, .card.alerta .sub { color: #fff; }
  .card.alerta .label, .card.alerta .sub { opacity: .78; }
  .pior { color: var(--ink); font-weight: 700; }
  .melhor { color: var(--g600); font-weight: 600; }
  .card.alerta .pior, .card.alerta .melhor { color: #fff; }

  .criticos { margin-top: 14px; background: rgba(255, 255, 255, .97); border: 1px solid rgba(255, 255, 255, .6); border-left: 4px solid #05070d; border-radius: 12px; padding: 14px 18px; box-shadow: 0 10px 30px rgba(3, 10, 30, .28); }
  .criticos h3 { margin: 0 0 8px; font-size: 11px; font-weight: 600; color: var(--navy); text-transform: uppercase; letter-spacing: .08em; }
  .critico { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 5px 0; border-top: 1px solid var(--g100); color: var(--g600); }
  .critico:first-of-type { border-top: none; }
  .critico b { color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .box { background: rgba(255, 255, 255, .97); border: 1px solid rgba(255, 255, 255, .6); border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(3, 10, 30, .28); }
  .vazio { color: var(--g400); font-size: 13px; text-align: center; padding: 18px; margin: 0; }

  .jornada { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--g100); margin-bottom: 8px; }
  .jornada span { display: block; height: 100%; }
  .j-fila { background: var(--navy); } .j-desl { background: var(--g600); } .j-atend { background: var(--g300); }
  .legenda { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: var(--g600); margin-bottom: 14px; }
  .legenda i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
  .etapa { display: grid; grid-template-columns: 1.3fr repeat(4, 1fr) .6fr; gap: 8px; padding: 13px 0; border-top: 1px solid var(--g100); align-items: center; }
  .etapa.cab { border-top: none; font-size: 10px; font-weight: 600; color: var(--g400); text-transform: uppercase; letter-spacing: .08em; padding-top: 4px; }
  .etapa .nome { font-weight: 600; font-size: 14px; color: var(--ink); }
  .etapa .nome small { display: block; font-weight: 400; font-size: 11px; color: var(--g600); margin-top: 2px; }
  .etapa .num { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--g600); }
  .etapa .num.dest { font-weight: 700; color: var(--ink); }
  .aviso-amostra { font-size: 12px; color: var(--g600); background: var(--g100); padding: 8px 12px; border-radius: 6px; margin-top: 12px; }

  .barras { display: flex; align-items: flex-end; gap: 4px; height: 150px; padding-top: 18px; }
  .barras.dias { gap: 10px; }
  .barra-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
  .barra { width: 100%; max-width: 34px; border-radius: 3px 3px 0 0; background: var(--navy); transition: height .4s ease; }
  .barras:not(.dias) .barra { background: var(--g300); }
  .barras:not(.dias) .barra.pico { background: var(--navy); }
  .barra-num { font-size: 10px; font-weight: 600; color: var(--ink); margin-bottom: 3px; }
  .barra-label { font-size: 10px; color: var(--g400); margin-top: 6px; }

  .docas { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
  .fundo { background: var(--g100); border-radius: 999px; height: 6px; overflow: hidden; }
  .preenchido { height: 100%; background: var(--navy); border-radius: 999px; }
  .doca-nome { font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 10px; }
  .doca-meta { font-size: 12px; color: var(--g600); margin-top: 8px; }

  .forn { padding: 13px 0; border-top: 1px solid var(--g100); }
  .forn:first-child { border-top: none; padding-top: 0; }
  .forn:last-child { padding-bottom: 0; }
  .forn-topo { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; align-items: baseline; }
  .forn-nome { font-size: 14px; font-weight: 600; color: var(--ink); word-break: break-word; }
  .forn-meta { font-size: 12px; color: var(--g600); text-align: right; font-variant-numeric: tabular-nums; }
  .forn-meta b { color: var(--ink); font-weight: 600; }
  .tag-pouco { font-size: 10px; font-weight: 600; background: var(--g100); color: var(--g600); padding: 2px 7px; border-radius: 999px; margin-left: 8px; letter-spacing: .02em; }



  /* ---- Coleta x Descarga ---- */
  :root { --c-desc: #3b82f6; --c-col: #f5a623; }
  .tipos-box { padding: 22px; }
  .tipos-topo { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
  .tipos-topo b { font-size: 30px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tipos-topo span { font-size: 12px; color: var(--g600); }
  .tipos-barra { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--g100); gap: 3px; }
  .tipos-barra i { display: block; height: 100%; min-width: 6px; transition: width .4s ease; }
  .tipos-colunas { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
  .tipo-col { padding: 14px 16px; border-radius: 12px; background: var(--g100); border-top: 3px solid var(--cor); }
  .tipo-col .t-nome { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink); }
  .tipo-col .t-nome i { width: 9px; height: 9px; border-radius: 50%; background: var(--cor); }
  .tipo-col .t-num { font-size: 28px; font-weight: 700; color: var(--ink); margin: 8px 0 2px; font-variant-numeric: tabular-nums; }
  .tipo-col .t-num small { font-size: 13px; font-weight: 600; color: var(--g600); margin-left: 6px; }
  .t-linha { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--g600); padding-top: 8px; margin-top: 8px; border-top: 1px solid var(--g200); }
  .t-linha b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---- Por fornecedor ---- */
  .rank-cab, .rank-linha { display: grid; grid-template-columns: 28px minmax(0, 2.2fr) minmax(0, 1.3fr) repeat(3, minmax(0, .9fr)); gap: 12px; align-items: center; }
  .rank-cab { font-size: 10px; font-weight: 600; color: var(--g400); text-transform: uppercase; letter-spacing: .08em; padding: 0 4px 8px; }
  .rank-linha { padding: 12px 4px; border-top: 1px solid var(--g100); border-radius: 8px; }
  .rank-linha:hover { background: var(--g100); }
  .rank-pos { width: 26px; height: 26px; border-radius: 50%; background: var(--g100); color: var(--g600); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .rank-linha:nth-child(2) .rank-pos { background: var(--c-col); color: #1b1300; }
  .rank-nome { font-size: 14px; font-weight: 600; color: var(--ink); word-break: break-word; }
  .rank-volume { display: flex; align-items: center; gap: 10px; }
  .rank-volume b { font-size: 16px; min-width: 22px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .rank-volume .fundo { flex: 1; height: 8px; }
  .rank-tempo { font-size: 14px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .rank-tempo.ruim { color: #e5484d; }
  .rank-tempo.bom { color: #30a46c; }
  .rank-tempo.nulo { color: var(--g400); font-weight: 400; }
  .rank-legenda { font-size: 12px; color: var(--g600); margin-top: 12px; }
  .rank-legenda .ponto { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 4px 0 12px; }

  /* ---- Por doca ---- */
  .doca-grupo { margin-bottom: 18px; }
  .doca-grupo h4 { margin: 0 0 8px 2px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgba(255, 255, 255, .7); }
  .docas-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .doca-card { position: relative; padding: 14px 16px; border-radius: 14px; background: rgba(255, 255, 255, .97); box-shadow: 0 10px 30px rgba(3, 10, 30, .28); overflow: hidden; }
  .doca-card .d-nome { font-size: 12px; font-weight: 600; color: var(--g600); text-transform: uppercase; letter-spacing: .05em; }
  .doca-card .d-num { font-size: 32px; font-weight: 700; color: var(--ink); margin: 4px 0 8px; font-variant-numeric: tabular-nums; line-height: 1; }
  .doca-card .d-num small { font-size: 12px; font-weight: 600; color: var(--g600); margin-left: 4px; }
  .doca-card .d-meta { font-size: 12px; color: var(--g600); margin-top: 8px; display: flex; justify-content: space-between; }
  .doca-card .d-meta b { color: var(--ink); font-weight: 600; }
  .doca-card.top { outline: 2px solid var(--c-col); }
  .doca-card.top .d-nome::after { content: " \2605"; color: var(--c-col); }
  .doca-card.zerada { opacity: .6; }
  body:is([data-cartoes="vidro"], [data-cartoes="preto"]) .doca-card {
    --ink: #fff; --g600: rgba(255,255,255,.66); --g400: rgba(255,255,255,.46);
    --g300: rgba(255,255,255,.30); --g200: rgba(255,255,255,.16); --g100: rgba(255,255,255,.09);
    --navy: #a9c6ff; color: #fff;
  }
  body[data-cartoes="vidro"] .doca-card { background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.20); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 10px 34px rgba(2,8,26,.35); }
  body[data-cartoes="preto"] .doca-card { background: #070b14; border: 1px solid rgba(255,255,255,.10); box-shadow: 0 10px 34px rgba(2,8,26,.45); }

  @media (max-width: 700px) {
    .tipos-colunas { grid-template-columns: 1fr; }
    .rank-cab { display: none; }
    .rank-linha { grid-template-columns: 28px minmax(0, 1fr) minmax(0, 1fr); row-gap: 6px; }
    .rank-linha .rank-volume { grid-column: 2 / -1; }
    .rank-linha .rank-tempo { grid-column: auto; }
    .rank-linha .rank-tempo::before { content: attr(data-l); display: block; font-size: 10px; font-weight: 600; color: var(--g400); text-transform: uppercase; letter-spacing: .06em; }
  }

  /* ---- temas dos cartoes (Branco e o padrao acima) ---- */
  body:is([data-cartoes="vidro"], [data-cartoes="preto"]) :is(.card, .box, .criticos) {
    --ink: #fff; --g600: rgba(255,255,255,.66); --g400: rgba(255,255,255,.46);
    --g300: rgba(255,255,255,.30); --g200: rgba(255,255,255,.16); --g100: rgba(255,255,255,.09);
    --navy: #a9c6ff; color: #fff;
  }
  body[data-cartoes="vidro"] :is(.card, .box, .criticos) {
    background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.20);
    backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 10px 34px rgba(2,8,26,.35);
  }
  body[data-cartoes="preto"] :is(.card, .box, .criticos) {
    background: #070b14; border: 1px solid rgba(255,255,255,.10); box-shadow: 0 10px 34px rgba(2,8,26,.45);
  }
  body:is([data-cartoes="vidro"], [data-cartoes="preto"]) .criticos { border-left: 4px solid #fff; }
  body:is([data-cartoes="vidro"], [data-cartoes="preto"]) .card.alerta {
    background: #fff; border-color: #fff; --ink: #0b0f1a; --g600: #4b5563; box-shadow: 0 10px 34px rgba(2,8,26,.45);
  }
  body:is([data-cartoes="vidro"], [data-cartoes="preto"]) .card.alerta .valor { color: #0b0f1a; }
  body:is([data-cartoes="vidro"], [data-cartoes="preto"]) .card.alerta :is(.label, .sub) { color: #4b5563; opacity: 1; }
  body:is([data-cartoes="vidro"], [data-cartoes="preto"]) .barras:not(.dias) .barra.pico { background: #fff; }
  .seg + .seg { margin-left: 4px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 0 28px; align-items: start; }
  @media (max-width: 1100px) { .cols { grid-template-columns: minmax(0, 1fr); } }

  @media (max-width: 700px) {
    header { flex-wrap: wrap; padding: 12px 16px; gap: 10px; }
    header h1 { font-size: 14px; }
    main { padding: 4px 14px 36px; }
    .cards { gap: 10px; }
    .card { padding: 14px; } .card .valor { font-size: 24px; }
    .toolbar .espaco { display: none; }
    .etapa { grid-template-columns: 1fr 1fr 1fr; }
    .etapa.cab { display: none; }
    .etapa .nome { grid-column: 1 / -1; }
    .etapa .num::before { content: attr(data-l); display: block; font-size: 10px; color: var(--g400); text-transform: uppercase; font-weight: 600; letter-spacing: .06em; }
    .barras { gap: 2px; }
    .barra-label { font-size: 9px; }
    .forn-topo { flex-direction: column; gap: 2px; }
    .forn-meta { text-align: left; }
  }
</style>
</head>
<body>
<header>
  <span class="logo"><img src="/static/logo-dsv.webp" alt="DSV" /></span>
  <h1>Dashboard</h1>
  <a class="nav-link" href="/">Fila e historico</a>
  <button class="nav-link" onclick="sair()">Sair</button>
</header>
<main>
  <div class="toolbar">
    <div class="seg" id="seg">
      <button data-p="hoje">Hoje</button>
      <button data-p="7d">7 dias</button>
      <button data-p="30d">30 dias</button>
    </div>
    <div class="seg" id="seg-cartoes" title="Cor dos cartoes">
      <button data-t="branco">Branco</button>
      <button data-t="vidro">Vidro</button>
      <button data-t="preto">Preto</button>
    </div>
    <span class="espaco"></span>
    <div class="meta-box" id="meta-box">
      Meta de espera
      <input type="number" id="meta-input" min="1" max="1440" />
      min
      <button class="btn-mini" onclick="salvarMeta()">Salvar</button>
    </div>
    <a class="btn-mini" id="btn-csv" href="#">Exportar CSV</a>
  </div>

  <p class="secao" style="margin-top:0">Agora</p>
  <div class="cards" id="cards-agora"></div>
  <div id="criticos"></div>

  <p class="secao" id="titulo-resumo">Resumo do periodo</p>
  <div class="cards" id="cards-resumo"></div>

  <div class="cols">
    <div class="col">
      <p class="secao">Tempo por etapa</p>
      <div class="box" id="etapas"></div>

      <p class="secao">Coleta x Descarga</p>
      <div id="tipos"></div>

      <p class="secao">Por fornecedor</p>
      <div class="box" id="fornecedores"></div>
    </div>
    <div class="col">
      <p class="secao">Chegadas por hora do dia</p>
      <div class="box"><div class="barras" id="grafico-horas"></div></div>

      <p class="secao" id="titulo-dias">Entradas por dia</p>
      <div class="box"><div class="barras dias" id="grafico-dias"></div></div>

      <p class="secao">Por doca</p>
      <div id="docas"></div>
    </div>
  </div>
</main>
<script>
let periodo = "hoje";
try { periodo = localStorage.getItem("periodoDash") || "hoje"; } catch (e) {}
let metaMin = 30;

let temaCartoes = "vidro";
try { temaCartoes = localStorage.getItem("temaCartoes") || "vidro"; } catch (e) {}
function aplicarTema() {
  document.body.dataset.cartoes = temaCartoes;
  document.querySelectorAll("#seg-cartoes button").forEach((b) => b.classList.toggle("ativo", b.dataset.t === temaCartoes));
}
document.querySelectorAll("#seg-cartoes button").forEach((b) => {
  b.onclick = () => {
    temaCartoes = b.dataset.t;
    try { localStorage.setItem("temaCartoes", temaCartoes); } catch (e) {}
    aplicarTema();
  };
});
aplicarTema();

const LABEL_ANTERIOR = { hoje: "ontem", "7d": "7 dias anteriores", "30d": "30 dias anteriores" };

function el(tag, cls, texto) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (texto !== undefined && texto !== null) e.textContent = texto;
  return e;
}

function dur(seg) {
  if (seg == null) return "-";
  const h = Math.floor(seg / 3600), m = Math.floor((seg % 3600) / 60), s = Math.floor(seg % 60);
  if (h > 0) return `${h}h ${String(m).padStart(2, "0")}m`;
  if (m > 0) return `${m}m ${String(s).padStart(2, "0")}s`;
  return `${s}s`;
}

function delta(atual, ant, menorEMelhor) {
  if (atual == null || ant == null || ant === 0) return null;
  const pct = Math.round(((atual - ant) / ant) * 100);
  if (pct === 0) return { texto: `igual a ${LABEL_ANTERIOR[periodo]}`, cls: "" };
  const subiu = pct > 0;
  const bom = menorEMelhor ? !subiu : subiu;
  return { texto: `${subiu ? "▲" : "▼"} ${Math.abs(pct)}% vs ${LABEL_ANTERIOR[periodo]}`, cls: bom ? "melhor" : "pior" };
}

function card(valor, label, sub, cls) {
  const c = el("div", "card" + (cls ? " " + cls : ""));
  c.append(el("div", "valor", valor), el("div", "label", label));
  if (sub) {
    const s = el("div", "sub", typeof sub === "string" ? sub : sub.texto);
    if (sub.cls) s.className += " " + sub.cls;
    c.append(s);
  }
  return c;
}

function setAtivo() {
  document.querySelectorAll("#seg button").forEach((b) => b.classList.toggle("ativo", b.dataset.p === periodo));
  document.getElementById("btn-csv").href = `/api/exportar.csv?periodo=${periodo}`;
}

document.querySelectorAll("#seg button").forEach((b) => {
  b.onclick = () => {
    periodo = b.dataset.p;
    try { localStorage.setItem("periodoDash", periodo); } catch (e) {}
    setAtivo();
    carregar();
  };
});

function renderAgora(d) {
  const a = d.agora;
  const alvo = document.getElementById("cards-agora");
  alvo.replaceChildren(
    card(a.aguardando, "Aguardando chamada"),
    card(a.chamados + a.na_doca + a.saindo, "Chamados / na doca", `${a.chamados} a caminho · ${a.na_doca} na doca · ${a.saindo} saindo`),
    card(dur(a.maior_espera_seg), "Maior espera agora", a.maior_espera_seg != null ? `meta: ${d.meta_espera_min} min` : "ninguem aguardando",
      a.maior_espera_seg != null && a.maior_espera_seg > d.meta_espera_min * 60 ? "alerta" : ""),
    card(a.acima_meta, "Acima da meta agora", `esperando mais de ${d.meta_espera_min} min`, a.acima_meta > 0 ? "alerta" : "")
  );
  const c = document.getElementById("criticos");
  c.replaceChildren();
  if (a.criticos.length) {
    const box = el("div", "criticos");
    box.append(el("h3", null, "Esperando acima da meta"));
    for (const x of a.criticos) {
      const linha = el("div", "critico");
      linha.append(el("span", null, `${x.nome} · carga ${x.carga} · ${x.fornecedor}`), el("b", null, dur(x.espera_seg)));
      box.append(linha);
    }
    c.append(box);
  }
}

function renderResumo(d) {
  const r = d.resumo, ant = d.anterior, f = d.etapas.fila;
  document.getElementById("titulo-resumo").textContent =
    "Resumo — " + { hoje: "hoje", "7d": "ultimos 7 dias", "30d": "ultimos 30 dias" }[d.periodo];
  const pct = r.dentro_meta_pct;
  document.getElementById("cards-resumo").replaceChildren(
    card(r.chegadas, "Chegadas", delta(r.chegadas, ant.chegadas, false)),
    card(r.atendidos, "Atendidos", delta(r.atendidos, ant.atendidos, false)),
    card(pct == null ? "-" : pct + "%", `Chamados em ate ${d.meta_espera_min} min`,
      r.dentro_meta_total ? `${r.dentro_meta_n} de ${r.dentro_meta_total} motoristas` : "sem chamadas no periodo",
      pct != null && pct < 80 ? "alerta" : ""),
    card(dur(f.mediana), "Espera mediana na fila", delta(f.mediana, ant.espera_mediana, true) || (f.n ? `P90: ${dur(f.p90)}` : ""))
  );
}

function renderEtapas(d) {
  const e = d.etapas;
  const box = document.getElementById("etapas");
  box.replaceChildren();
  const partes = [["fila", "j-fila", "Fila"], ["deslocamento", "j-desl", "Deslocamento"], ["atendimento", "j-atend", "Atendimento"]];
  const soma = partes.reduce((t, [k]) => t + (e[k].mediana || 0), 0);
  if (soma > 0) {
    const barra = el("div", "jornada");
    for (const [k, cls] of partes) {
      const s = el("span", cls);
      s.style.width = ((e[k].mediana || 0) / soma) * 100 + "%";
      barra.append(s);
    }
    const leg = el("div", "legenda");
    for (const [k, cls, nome] of partes) {
      const item = el("span");
      const i = el("i", cls);
      item.append(i, `${nome}: ${dur(e[k].mediana)}`);
      leg.append(item);
    }
    box.append(barra, leg);
  }
  const cab = el("div", "etapa cab");
  for (const t of ["Etapa", "Mediana", "Media", "P90", "Maximo", "Registros"]) cab.append(el("span", null, t));
  box.append(cab);
  const defs = [
    ["fila", "Fila", "entrada ate a chamada"],
    ["deslocamento", "Deslocamento", "chamada ate chegar na doca"],
    ["atendimento", "Atendimento", "chegada ate a saida da doca"],
    ["nf", "Espera da NF (coleta)", "saida da doca ate a NF liberada"],
    ["total", "Total no patio", "entrada ate a saida da doca"],
  ];
  let poucos = false;
  for (const [k, nome, desc] of defs) {
    const s = e[k];
    const linha = el("div", "etapa");
    const n = el("div", "nome", nome);
    n.append(el("small", null, desc));
    linha.append(n);
    const vals = [["Mediana", s.mediana, true], ["Media", s.media], ["P90", s.p90], ["Maximo", s.maximo]];
    for (const [l, v, dest] of vals) {
      const c = el("div", "num" + (dest ? " dest" : ""), dur(v));
      c.dataset.l = l;
      linha.append(c);
    }
    const c = el("div", "num", s.n);
    c.dataset.l = "Registros";
    linha.append(c);
    if (s.n > 0 && s.n < 5) poucos = true;
    box.append(linha);
  }
  if (poucos) box.append(el("div", "aviso-amostra", "Algumas etapas tem menos de 5 registros no periodo, entao os numeros ainda sao pouco confiaveis."));
  if (e.atendimento.n === 0) box.append(el("div", "aviso-amostra", "Deslocamento e atendimento so aparecem para motoristas que tocaram em \"Cheguei na doca\" e foram finalizados depois da atualizacao do sistema."));
}

function barras(alvo, valores, rotulos, destacarMax) {
  alvo.replaceChildren();
  const max = Math.max(...valores, 1);
  valores.forEach((v, i) => {
    const col = el("div", "barra-col");
    col.append(el("div", "barra-num", v > 0 ? v : ""));
    const b = el("div", "barra" + (destacarMax && v === max && v > 0 ? " pico" : ""));
    b.style.height = Math.max(3, (v / max) * 110) + "px";
    col.append(b, el("div", "barra-label", rotulos[i]));
    alvo.append(col);
  });
}

function renderGraficos(d) {
  barras(document.getElementById("grafico-horas"), d.por_hora, d.por_hora.map((_, h) => (h % 3 === 0 ? String(h).padStart(2, "0") : "")), true);
  document.getElementById("titulo-dias").textContent = `Entradas por dia (ultimos ${d.por_dia.length} dias)`;
  const rot = d.por_dia.map((x, i) => {
    if (d.por_dia.length > 7 && i % 3 !== 0) return "";
    const [, m, dia] = x.dia.split("-");
    return `${dia}/${m}`;
  });
  barras(document.getElementById("grafico-dias"), d.por_dia.map((x) => x.n), rot, false);
}

function renderDocas(d) {
  const total = d.por_doca.reduce((t, x) => t + x.n, 0);
  const maior = Math.max(...d.por_doca.map((x) => x.n), 0);
  const alvo = document.getElementById("docas");
  alvo.replaceChildren();
  const grupos = [["Recebimento", []], ["Expedição", []], ["Outras docas", []]];
  for (const x of d.por_doca) {
    const g = x.doca.startsWith("Recebimento") ? 0 : x.doca.startsWith("Expedi") ? 1 : 2;
    grupos[g][1].push(x);
  }
  for (const [titulo, lista] of grupos) {
    if (!lista.length) continue;
    if (titulo === "Outras docas" && lista.every((x) => x.n === 0)) continue;
    const bloco = el("div", "doca-grupo");
    bloco.append(el("h4", null, titulo));
    const grade = el("div", "docas-grade");
    for (const x of lista) {
      const pct = total ? Math.round((x.n / total) * 100) : 0;
      const c = el("div", "doca-card" + (x.n && x.n === maior ? " top" : "") + (x.n ? "" : " zerada"));
      c.append(el("div", "d-nome", x.doca));
      const num = el("div", "d-num", x.n);
      num.append(el("small", null, x.n === 1 ? "motorista" : "motoristas"));
      c.append(num);
      const fundo = el("div", "fundo");
      const p = el("div", "preenchido");
      p.style.width = pct + "%";
      fundo.append(p);
      c.append(fundo);
      const m1 = el("div", "d-meta");
      m1.append(el("span", null, "Uso"), el("b", null, pct + "%"));
      const m2 = el("div", "d-meta");
      m2.append(el("span", null, "Atendimento"), el("b", null, dur(x.atendimento_media)));
      c.append(m1, m2);
      grade.append(c);
    }
    bloco.append(grade);
    alvo.append(bloco);
  }
}

function renderTipos(d) {
  const alvo = document.getElementById("tipos");
  alvo.replaceChildren();
  const total = d.por_tipo.reduce((t, x) => t + x.n, 0);
  if (!d.por_tipo.length) { alvo.append(el("p", "vazio", "Sem registros no periodo.")); return; }
  const nomes = { COLETA: "Coleta", DESCARGA: "Descarga", "NAO INFORMADO": "Nao informado" };
  const cores = { COLETA: "var(--c-col)", DESCARGA: "var(--c-desc)" };
  const ordem = [...d.por_tipo].sort((a, b) => (a.tipo === "DESCARGA" ? -1 : b.tipo === "DESCARGA" ? 1 : b.n - a.n));
  const topo = el("div", "tipos-topo");
  topo.append(el("b", null, total), el("span", null, total === 1 ? "motorista no periodo" : "motoristas no periodo"));
  const barra = el("div", "tipos-barra");
  for (const x of ordem) {
    const seg = el("i");
    seg.style.width = (total ? (x.n / total) * 100 : 0) + "%";
    seg.style.background = cores[x.tipo] || "var(--g400)";
    seg.title = `${nomes[x.tipo] || x.tipo}: ${x.n}`;
    barra.append(seg);
  }
  const colunas = el("div", "tipos-colunas");
  for (const x of ordem) {
    const c = el("div", "tipo-col");
    c.style.setProperty("--cor", cores[x.tipo] || "var(--g400)");
    const nome = el("div", "t-nome");
    nome.append(el("i"), nomes[x.tipo] || x.tipo);
    const num = el("div", "t-num", x.n);
    num.append(el("small", null, (total ? Math.round((x.n / total) * 100) : 0) + "%"));
    const l1 = el("div", "t-linha");
    l1.append(el("span", null, "Espera media"), el("b", null, dur(x.espera_media)));
    const l2 = el("div", "t-linha");
    l2.append(el("span", null, "Atendimento medio"), el("b", null, dur(x.atendimento_media)));
    c.append(nome, num, l1, l2);
    colunas.append(c);
  }
  const box = el("div", "box tipos-box");
  box.append(topo, barra, colunas);
  alvo.append(box);
}

function renderFornecedores(d) {
  const box = document.getElementById("fornecedores");
  box.replaceChildren();
  if (!d.por_fornecedor.length) { box.append(el("p", "vazio", "Nenhum fornecedor registrado no periodo.")); return; }
  const max = Math.max(...d.por_fornecedor.map((x) => x.n), 1);
  const cab = el("div", "rank-cab");
  for (const t of ["", "Fornecedor", "Chegadas", "Espera media", "Pior espera", "Atendimento"]) cab.append(el("span", null, t));
  box.append(cab);
  const classeEspera = (seg) => (seg == null ? "nulo" : seg > metaMin * 60 ? "ruim" : "bom");
  d.por_fornecedor.forEach((f, i) => {
    const linha = el("div", "rank-linha");
    linha.append(el("span", "rank-pos", i + 1));
    const nome = el("span", "rank-nome", f.fornecedor);
    if (f.baixa_amostra) nome.append(el("span", "tag-pouco", "poucos registros"));
    const vol = el("div", "rank-volume");
    const fundo = el("div", "fundo");
    const p = el("div", "preenchido");
    p.style.width = (f.n / max) * 100 + "%";
    fundo.append(p);
    vol.append(el("b", null, f.n), fundo);
    const t1 = el("span", "rank-tempo " + classeEspera(f.espera_media), dur(f.espera_media));
    t1.dataset.l = "Espera media";
    const t2 = el("span", "rank-tempo " + classeEspera(f.espera_max), dur(f.espera_max));
    t2.dataset.l = "Pior espera";
    const t3 = el("span", "rank-tempo" + (f.atendimento_media == null ? " nulo" : ""), dur(f.atendimento_media));
    t3.dataset.l = "Atendimento";
    linha.append(nome, vol, t1, t2, t3);
    box.append(linha);
  });
  const leg = el("div", "rank-legenda");
  leg.append("Cores da espera: ");
  const bom = el("span", "ponto"); bom.style.background = "#30a46c";
  const ruim = el("span", "ponto"); ruim.style.background = "#e5484d";
  leg.append(bom, `dentro da meta (${metaMin} min)`, ruim, "acima da meta");
  box.append(leg);
}

async function carregar() {
  const res = await fetch(`/api/dashboard?periodo=${periodo}`);
  if (res.status === 401) { window.location.href = "/login"; return; }
  if (!res.ok) return;
  const d = await res.json();
  metaMin = d.meta_espera_min;
  const inp = document.getElementById("meta-input");
  if (document.activeElement !== inp) inp.value = metaMin;
  renderAgora(d);
  renderResumo(d);
  renderEtapas(d);
  renderGraficos(d);
  renderDocas(d);
  renderTipos(d);
  renderFornecedores(d);
}

async function salvarMeta() {
  const v = parseInt(document.getElementById("meta-input").value, 10);
  if (!v || v < 1 || v > 1440) { alert("Informe a meta em minutos (1 a 1440)."); return; }
  const res = await fetch("/api/config/meta", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ minutos: v }),
  });
  if (!res.ok) { alert("Nao foi possivel salvar a meta."); return; }
  carregar();
}

async function sair() {
  await fetch("/api/logout", { method: "POST" });
  window.location.href = "/login";
}

fetch("/api/eu").then((r) => r.json()).then((d) => { if (!d.pode_editar) document.getElementById("meta-box").style.display = "none"; }).catch(() => {});
setAtivo();
carregar();
setInterval(carregar, 15000);
</script>

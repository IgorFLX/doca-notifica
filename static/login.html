<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login - Painel da Doca</title>
<link rel="icon" type="image/png" href="/static/favicon.png" />
<style>
  :root {
    color-scheme: light;
    --navy-dark: #0a1638;
    --navy: #16255c;
    --navy-light: #1d3a8f;
  }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; color: #1a1a1a;
    background: linear-gradient(145deg, var(--navy-dark) 0%, var(--navy) 55%, var(--navy-light) 100%);
    background-attachment: fixed;
  }
  .wrap { width: 100%; max-width: 360px; margin: 16px; }
  .logo-box { text-align: center; margin-bottom: 22px; }
  .logo-box span {
    display: inline-block; background: #fff; padding: 16px 26px;
    border-radius: 16px; box-shadow: 0 10px 28px rgba(0,0,0,.3);
  }
  .logo-box img { width: 150px; height: auto; display: block; }
  .card {
    width: 100%; box-sizing: border-box; padding: 28px;
    background: #fff; border-radius: 18px; box-shadow: 0 12px 32px rgba(0,0,0,.35);
    text-align: center;
  }
  h1 { font-size: 18px; margin: 0 0 18px; color: var(--navy-dark); }
  input[type=text], input[type=password] {
    width: 100%; box-sizing: border-box; padding: 13px 14px; margin-bottom: 12px;
    border: 1.5px solid #dde1ea; border-radius: 10px; font-size: 15px;
  }
  input:focus { outline: none; border-color: var(--navy-light); }
  button {
    width: 100%; padding: 13px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, var(--navy-light), var(--navy-dark));
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:hover { opacity: .9; }
  .erro { color: #b91c1c; font-size: 13px; margin: 0 0 12px; min-height: 16px; }
  .voltar { display: block; margin-top: 16px; font-size: 13px; color: var(--navy-light); text-decoration: none; }
  .voltar:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-box"><span><img src="/static/logo-dsv.webp" alt="DSV" /></span></div>
  <div class="card">
    <h1>Acesso ao painel da doca</h1>
    <p class="erro" id="erro"></p>
    <input type="text" id="usuario" placeholder="Usuario" autocomplete="username" />
    <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" />
    <button onclick="entrar()">Entrar</button>
    <a class="voltar" href="/registrar">Criar um acesso novo</a>
  </div>
</div>
<script>
async function entrar() {
  const usuario = document.getElementById("usuario").value.trim();
  const senha = document.getElementById("senha").value;
  const erro = document.getElementById("erro");
  erro.textContent = "";
  if (!usuario || !senha) { erro.textContent = "Preencha usuario e senha."; return; }
  const res = await fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ usuario, senha }),
  });
  if (res.ok) {
    window.location.href = "/";
  } else {
    erro.textContent = "Usuario ou senha invalidos.";
  }
}

document.getElementById("senha").addEventListener("keydown", (e) => {
  if (e.key === "Enter") entrar();
});
</script>
</body>
</html>

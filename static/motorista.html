<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aguardando Doca</title>
<style>
  :root {
    color-scheme: light;
    --navy-dark: #0a1638;
    --navy: #16255c;
    --navy-light: #1d3a8f;
  }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; color: #1a1a1a;
    transition: background .3s ease;
    background:
      radial-gradient(circle at 15% 15%, rgba(255,255,255,.07), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(255,255,255,.05), transparent 40%),
      linear-gradient(145deg, var(--navy-dark) 0%, var(--navy) 55%, var(--navy-light) 100%);
    background-attachment: fixed;
  }
  .wrap { width: 100%; max-width: 380px; margin: 16px; }
  .logo-box { text-align: center; margin-bottom: 18px; }
  .logo-box span {
    display: inline-block; background: #fff; padding: 14px 24px;
    border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.25);
  }
  .logo-box img { width: 120px; height: auto; display: block; }
  .card {
    width: 100%; box-sizing: border-box; padding: 28px;
    background: #fff; border-radius: 18px; box-shadow: 0 12px 32px rgba(0,0,0,.35);
    text-align: center;
  }
  h1 { font-size: 18px; margin: 0 0 18px; color: var(--navy-dark); }
  input[type=text] {
    width: 100%; box-sizing: border-box; padding: 13px 14px; margin-bottom: 12px;
    border: 1.5px solid #dde1ea; border-radius: 10px; font-size: 15px;
    transition: border-color .15s ease;
  }
  input[type=text]:focus {
    outline: none; border-color: var(--navy-light);
  }
  button {
    width: 100%; padding: 13px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, var(--navy-light), var(--navy-dark));
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: opacity .15s ease;
  }
  button:hover { opacity: .9; }
  .espera { font-size: 15px; color: #555; }
  .pulso {
    width: 60px; height: 60px; margin: 16px auto; border-radius: 50%;
    background: var(--navy-light); animation: pulso 1.5s infinite;
  }
  @keyframes pulso { 0%{ transform: scale(1); opacity: .7 } 50%{ transform: scale(1.15); opacity: 1 } 100%{ transform: scale(1); opacity: .7 } }
  .chamado .card { background: #16a34a; color: #fff; }
  .doca-numero { font-size: 48px; font-weight: 800; margin: 10px 0; }
  .btn-cheguei { background: #fff; color: #16a34a; margin-top: 16px; background-image: none; }
  .btn-cheguei:disabled { opacity: .6; cursor: default; }
  .confirmado { color: #fff; margin-top: 14px; font-size: 14px; }
  .hidden { display: none; }
</style>
</head>
<body id="body">
<div class="wrap">
  <div class="logo-box"><span><img src="/static/logo-dsv.webp" alt="DSV" /></span></div>
  <div class="card" id="card">

  <div id="form-entrada">
    <h1>Entrar na fila da doca</h1>
    <input type="text" id="nome" placeholder="Seu nome" />
    <input type="text" id="carga" placeholder="ID da carga" />
    <button onclick="entrarNaFila()">Entrar na fila</button>
  </div>

  <div id="tela-espera" class="hidden">
    <h1>Aguardando chamada...</h1>
    <div class="pulso"></div>
    <p class="espera">Deixe esta tela aberta. Voce sera avisado com som e vibracao quando for a sua vez.</p>
  </div>

  <div id="tela-chamado" class="hidden">
    <h1>VA PARA A DOCA</h1>
    <div class="doca-numero" id="doca-numero">-</div>
    <button class="btn-cheguei" id="btn-cheguei" onclick="cheguei()">Cheguei na doca</button>
    <p class="confirmado hidden" id="confirmado-texto">Chegada registrada! Aguarde o operador.</p>
  </div>

  </div>
</div>

<script>
let motoristaId = localStorage.getItem("motoristaId");
let polling = null;
let jaTocou = false;

function mostrarTela(id) {
  document.querySelectorAll("#form-entrada, #tela-espera, #tela-chamado").forEach(el => el.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

async function entrarNaFila() {
  const nome = document.getElementById("nome").value.trim();
  const carga = document.getElementById("carga").value.trim();
  if (!nome || !carga) { alert("Preencha nome e ID da carga"); return; }
  const res = await fetch("/api/motoristas", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ nome, carga }),
  });
  const data = await res.json();
  motoristaId = data.id;
  localStorage.setItem("motoristaId", motoristaId);
  ativarNotificacoes();
  iniciarEspera();
}

async function ativarNotificacoes() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
  try {
    const registration = await navigator.serviceWorker.register("/sw.js");
    const permissao = await Notification.requestPermission();
    if (permissao !== "granted") return;

    const res = await fetch("/api/vapid-public-key");
    const { publicKey } = await res.json();
    if (!publicKey) return;

    let subscription = await registration.pushManager.getSubscription();
    if (!subscription) {
      subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey),
      });
    }

    await fetch(`/api/motoristas/${motoristaId}/subscribe`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ subscription: subscription.toJSON() }),
    });
  } catch (e) {
    console.error("Nao foi possivel ativar notificacoes push", e);
  }
}

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
}

function iniciarEspera() {
  mostrarTela("tela-espera");
  verificarStatus();
  polling = setInterval(verificarStatus, 2000);
}

async function verificarStatus() {
  if (!motoristaId) return;
  const res = await fetch(`/api/motoristas/${motoristaId}`);
  if (!res.ok) {
    localStorage.removeItem("motoristaId");
    motoristaId = null;
    clearInterval(polling);
    mostrarTela("form-entrada");
    return;
  }
  const m = await res.json();
  if (m.status === "chamado" || m.status === "na_doca") {
    document.getElementById("doca-numero").textContent = m.doca || "-";
    document.getElementById("body").classList.add("chamado");
    mostrarTela("tela-chamado");
    const btn = document.getElementById("btn-cheguei");
    const texto = document.getElementById("confirmado-texto");
    if (m.status === "na_doca") {
      btn.classList.add("hidden");
      texto.classList.remove("hidden");
    } else {
      btn.classList.remove("hidden");
      btn.disabled = false;
      btn.textContent = "Cheguei na doca";
      texto.classList.add("hidden");
    }
    if (!jaTocou) { jaTocou = true; tocarBip(); vibrar(); }
  } else if (m.status === "finalizado") {
    clearInterval(polling);
    localStorage.removeItem("motoristaId");
    motoristaId = null;
    jaTocou = false;
    document.getElementById("body").classList.remove("chamado");
    mostrarTela("form-entrada");
  }
}

async function cheguei() {
  if (!motoristaId) return;
  const btn = document.getElementById("btn-cheguei");
  btn.disabled = true;
  btn.textContent = "Confirmando...";
  try {
    await fetch(`/api/motoristas/${motoristaId}/cheguei`, { method: "POST" });
    btn.classList.add("hidden");
    document.getElementById("confirmado-texto").classList.remove("hidden");
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Cheguei na doca";
    alert("Nao foi possivel confirmar, tente novamente.");
  }
}

function vibrar() {
  if (navigator.vibrate) navigator.vibrate([400, 200, 400, 200, 400]);
}

function tocarBip() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const tocarTom = (tempoInicio) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "square";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.3, tempoInicio);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(tempoInicio);
      osc.stop(tempoInicio + 0.35);
    };
    const agora = ctx.currentTime;
    tocarTom(agora);
    tocarTom(agora + 0.5);
    tocarTom(agora + 1.0);
  } catch (e) {
    console.error("Nao foi possivel tocar o bip", e);
  }
}

if (motoristaId) {
  ativarNotificacoes();
  iniciarEspera();
} else {
  mostrarTela("form-entrada");
}
</script>
</body>
</html>

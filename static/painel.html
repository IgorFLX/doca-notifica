<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Painel da Doca</title>
<style>
  :root {
    color-scheme: light;
    --navy-dark: #0a1638;
    --navy: #16255c;
    --navy-light: #1d3a8f;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, Arial, sans-serif; margin: 0;
    background: #eef1f7; color: #1a1a1a;
  }
  header {
    background: linear-gradient(120deg, var(--navy-dark), var(--navy) 60%, var(--navy-light));
    color: #fff; padding: 16px 24px;
    display: flex; align-items: center; gap: 16px;
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
  }
  header .logo { background: #fff; border-radius: 8px; padding: 6px 12px; display: flex; align-items: center; }
  header .logo img { height: 22px; display: block; }
  header h1 { margin: 0; font-size: 19px; font-weight: 600; }
  main { max-width: 960px; margin: 28px auto; padding: 0 20px; }
  .panel-title { font-size: 14px; font-weight: 600; color: #46516b; text-transform: uppercase; letter-spacing: .04em; margin: 0 0 10px 4px; }
  table {
    width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px;
    overflow: hidden; box-shadow: 0 2px 10px rgba(16,24,60,.08);
  }
  th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #eef0f5; }
  th {
    background: #f4f6fb; font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: #5a6480; font-weight: 700;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafbfe; }
  .status { padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .status-aguardando { background: #fef3c7; color: #92400e; }
  .status-chamado { background: #dbeafe; color: #1e40af; }
  .status-na_doca { background: #d1fae5; color: #065f46; }
  .row-actions { display: flex; gap: 8px; align-items: center; }
  select {
    padding: 8px 10px; border: 1.5px solid #dde1ea; border-radius: 8px; font-size: 13px;
    background: #fff; color: #1a1a1a;
  }
  button {
    padding: 8px 14px; border: none; border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: 700; transition: opacity .15s ease;
  }
  button:hover { opacity: .88; }
  .btn-chamar { background: linear-gradient(135deg, var(--navy-light), var(--navy-dark)); color: #fff; }
  .btn-finalizar { background: #9ca3af; color: #fff; }
  .empty { padding: 36px; text-align: center; color: #8891a8; background: #fff; border-radius: 12px; box-shadow: 0 2px 10px rgba(16,24,60,.08); }
  .refresh-note { font-size: 12px; color: #8891a8; margin: 10px 0 0 4px; }
  .qr-box {
    margin-top: 28px; background: #fff; border-radius: 12px; padding: 20px;
    box-shadow: 0 2px 10px rgba(16,24,60,.08); display: flex; align-items: center; gap: 18px;
  }
  .qr-box img { width: 110px; height: 110px; display: block; border-radius: 8px; }
  .qr-box div p { margin: 0 0 6px; font-size: 13px; color: #444; }
  .qr-box code { font-size: 12px; background: #f1f3f8; padding: 3px 8px; border-radius: 6px; color: var(--navy); }
</style>
</head>
<body>
<header>
  <span class="logo"><img src="/static/logo-dsv.webp" alt="DSV" /></span>
  <h1>Painel da Doca &mdash; Chamada de Motoristas</h1>
</header>
<main>
  <p class="panel-title">Fila de motoristas</p>
  <table>
    <thead>
      <tr><th>Motorista</th><th>ID da carga</th><th>Status</th><th>Doca</th><th>Acao</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">Nenhum motorista na fila.</div>
  <p class="refresh-note">Atualiza automaticamente a cada 3s.</p>

  <div class="qr-box">
    <img src="/qrcode" alt="QR Code para o motorista entrar na fila" />
    <div>
      <p>O motorista escaneia este QR Code com a camera do celular para abrir a fila e entrar.</p>
      <code id="link-motorista"></code>
    </div>
  </div>
</main>
<script>
const STATUS_LABEL = { aguardando: "Aguardando", chamado: "Chamado", na_doca: "Na doca" };

async function carregar() {
  const res = await fetch("/api/motoristas");
  const motoristas = await res.json();
  const tbody = document.getElementById("tbody");
  const empty = document.getElementById("empty");
  tbody.innerHTML = "";
  empty.style.display = motoristas.length ? "none" : "block";

  for (const m of motoristas) {
    const tr = document.createElement("tr");

    const tdNome = document.createElement("td");
    tdNome.textContent = m.nome;

    const tdCarga = document.createElement("td");
    tdCarga.textContent = m.carga;

    const tdStatus = document.createElement("td");
    const span = document.createElement("span");
    span.className = "status status-" + m.status;
    span.textContent = STATUS_LABEL[m.status] || m.status;
    tdStatus.appendChild(span);

    const tdDoca = document.createElement("td");
    tdDoca.textContent = m.doca || "-";

    const tdAcao = document.createElement("td");
    const wrap = document.createElement("div");
    wrap.className = "row-actions";

    if (m.status === "aguardando") {
      const select = document.createElement("select");
      for (const doca of ["A", "B"]) {
        const opt = document.createElement("option");
        opt.value = doca;
        opt.textContent = "Doca " + doca;
        select.appendChild(opt);
      }
      const btn = document.createElement("button");
      btn.className = "btn-chamar";
      btn.textContent = "Chamar";
      btn.onclick = () => chamar(m.id, select.value);
      wrap.appendChild(select);
      wrap.appendChild(btn);
    } else {
      const btn = document.createElement("button");
      btn.className = "btn-finalizar";
      btn.textContent = "Finalizar";
      btn.onclick = () => finalizar(m.id);
      wrap.appendChild(btn);
    }

    tdAcao.appendChild(wrap);
    tr.append(tdNome, tdCarga, tdStatus, tdDoca, tdAcao);
    tbody.appendChild(tr);
  }
}

async function chamar(id, doca) {
  await fetch(`/api/motoristas/${id}/chamar`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ doca }),
  });
  carregar();
}

async function finalizar(id) {
  await fetch(`/api/motoristas/${id}/finalizar`, { method: "POST" });
  carregar();
}

document.getElementById("link-motorista").textContent = window.location.origin + "/motorista";

carregar();
setInterval(carregar, 3000);
</script>
</body>
</html>
